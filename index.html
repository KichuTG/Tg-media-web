<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Telegram Media Search</title>
    <script src="https://cdn.jsdelivr.net/npm/axios/dist/axios.min.js"></script>
    <style>
        :root {
            --bg-color: #000000;
            --text-color: #ffffff;
            --accent-color: #7c4dff;
            --card-bg: #1a1a1a;
            --search-bg: #1e1e1e;
            --border-color: #333333;
        }
        
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, 'Open Sans', 'Helvetica Neue', sans-serif;
        }
        
        body {
            background-color: var(--bg-color);
            color: var(--text-color);
            min-height: 100vh;
            padding: 20px;
        }
        
        .container {
            max-width: 1200px;
            margin: 0 auto;
            padding: 20px;
        }
        
        header {
            text-align: center;
            margin-bottom: 30px;
        }
        
        h1 {
            font-size: 2.5rem;
            margin-bottom: 10px;
            background: linear-gradient(90deg, #7c4dff, #00bcd4);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }
        
        .subtitle {
            color: #aaaaaa;
            font-size: 1rem;
            margin-bottom: 20px;
        }
        
        .search-container {
            position: relative;
            margin-bottom: 30px;
        }
        
        .search-input {
            width: 100%;
            padding: 15px 20px;
            font-size: 1rem;
            border: 2px solid var(--border-color);
            border-radius: 50px;
            background-color: var(--search-bg);
            color: var(--text-color);
            outline: none;
            transition: all 0.3s ease;
        }
        
        .search-input:focus {
            border-color: var(--accent-color);
            box-shadow: 0 0 0 3px rgba(124, 77, 255, 0.2);
        }
        
        .search-icon {
            position: absolute;
            right: 20px;
            top: 50%;
            transform: translateY(-50%);
            color: #666666;
        }
        
        .results-container {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
            gap: 20px;
            margin-top: 20px;
        }
        
        .result-card {
            background-color: var(--card-bg);
            border-radius: 10px;
            padding: 20px;
            transition: all 0.3s ease;
            border: 1px solid var(--border-color);
        }
        
        .result-card:hover {
            transform: translateY(-5px);
            box-shadow: 0 10px 20px rgba(0, 0, 0, 0.3);
            border-color: var(--accent-color);
        }
        
        .file-name {
            font-size: 1.1rem;
            margin-bottom: 10px;
            color: var(--text-color);
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }
        
        .file-info {
            display: flex;
            justify-content: space-between;
            color: #aaaaaa;
            font-size: 0.9rem;
            margin-bottom: 15px;
        }
        
        .file-link {
            display: inline-block;
            padding: 8px 15px;
            background-color: var(--accent-color);
            color: white;
            text-decoration: none;
            border-radius: 5px;
            font-weight: 500;
            transition: all 0.2s ease;
        }
        
        .file-link:hover {
            background-color: #6a3dff;
            transform: scale(1.05);
        }
        
        .loading {
            text-align: center;
            padding: 20px;
            color: #aaaaaa;
        }
        
        .no-results {
            text-align: center;
            padding: 40px;
            color: #666666;
            grid-column: 1 / -1;
        }
        
        .result-count {
            color: #aaaaaa;
            margin-bottom: 20px;
            font-size: 0.9rem;
        }
        
        @media (max-width: 768px) {
            .results-container {
                grid-template-columns: 1fr;
            }
            
            h1 {
                font-size: 2rem;
            }
        }
        
        /* Custom scrollbar */
        ::-webkit-scrollbar {
            width: 8px;
        }
        
        ::-webkit-scrollbar-track {
            background: var(--bg-color);
        }
        
        ::-webkit-scrollbar-thumb {
            background: #444444;
            border-radius: 4px;
        }
        
        ::-webkit-scrollbar-thumb:hover {
            background: #555555;
        }
    </style>
</head>
<body>
    <div class="container">
        <header>
            <h1>Telegram Media Search</h1>
            <p class="subtitle">Search through your saved Telegram files</p>
        </header>
        
        <div class="search-container">
            <input type="text" class="search-input" placeholder="Search for files..." id="searchInput" autocomplete="off">
            <div class="search-icon">🔍</div>
        </div>
        
        <div class="result-count" id="resultCount">0 results found</div>
        
        <div class="results-container" id="resultsContainer">
            <div class="no-results">Start typing to search for files</div>
        </div>
    </div>

    <script>
        // Configuration - Update these with your details
        const config = {
            apiUrl: '/api/search', // Your backend API endpoint
            botUsername: 'your_bot_username', // Replace with your bot username
            debounceTime: 300 // Time in ms to wait after typing before searching
        };
        
        let searchTimeout;
        let currentSearchQuery = '';
        
        // DOM Elements
        const searchInput = document.getElementById('searchInput');
        const resultsContainer = document.getElementById('resultsContainer');
        const resultCount = document.getElementById('resultCount');
        
        // Event Listeners
        searchInput.addEventListener('input', handleSearchInput);
        
        // Functions
        function handleSearchInput(e) {
            const query = e.target.value.trim();
            currentSearchQuery = query;
            
            clearTimeout(searchTimeout);
            
            if (query.length === 0) {
                showInitialState();
                return;
            }
            
            searchTimeout = setTimeout(() => {
                performSearch(query);
            }, config.debounceTime);
        }
        
        async function performSearch(query) {
            try {
                showLoadingState();
                
                const response = await axios.get(config.apiUrl, {
                    params: { query }
                });
                
                if (currentSearchQuery !== query) return; // In case of rapid typing
                
                if (response.data && response.data.length > 0) {
                    displayResults(response.data);
                } else {
                    showNoResults();
                }
            } catch (error) {
                console.error('Search error:', error);
                showErrorState();
            }
        }
        
        function displayResults(files) {
            resultsContainer.innerHTML = '';
            
            files.forEach(file => {
                const card = document.createElement('div');
                card.className = 'result-card';
                
                const telegramLink = `https://t.me/${config.botUsername}?start=${file.file_id}`;
                
                card.innerHTML = `
                    <div class="file-name" title="${file.file_name}">${file.file_name}</div>
                    <div class="file-info">
                        <span>${formatFileSize(file.file_size)}</span>
                        <span>${file.file_type || 'Unknown'}</span>
                    </div>
                    <a href="${telegramLink}" class="file-link" target="_blank">Get File</a>
                `;
                
                resultsContainer.appendChild(card);
            });
            
            resultCount.textContent = `${files.length} ${files.length === 1 ? 'result' : 'results'} found`;
        }
        
        function showLoadingState() {
            resultsContainer.innerHTML = '<div class="loading">Searching...</div>';
            resultCount.textContent = 'Searching...';
        }
        
        function showNoResults() {
            resultsContainer.innerHTML = '<div class="no-results">No files found matching your search</div>';
            resultCount.textContent = '0 results found';
        }
        
        function showInitialState() {
            resultsContainer.innerHTML = '<div class="no-results">Start typing to search for files</div>';
            resultCount.textContent = '0 results found';
        }
        
        function showErrorState() {
            resultsContainer.innerHTML = '<div class="no-results">Error occurred while searching. Please try again.</div>';
            resultCount.textContent = 'Search error';
        }
        
        function formatFileSize(bytes) {
            if (bytes === 0) return '0 Bytes';
            const k = 1024;
            const sizes = ['Bytes', 'KB', 'MB', 'GB'];
            const i = Math.floor(Math.log(bytes) / Math.log(k));
            return parseFloat((bytes / Math.pow(k, i)).toFixed(2)) + ' ' + sizes[i];
        }
    </script>
</body>
  </html>
